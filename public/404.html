<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable | Jean-David Zamblezie</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="theme-color" content="#2d6b6b" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Syne:wght@500;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --bg: #ffffff;
        --surface: #f0f5f5;
        --border: #d0e0e0;
        --text: #2d6b6b;
        --muted: #6b9e9e;
        --dev-bg: #0a0a0a;
        --dev-border: #222222;
        --dev-text: #e5e5e5;
        --dev-muted: #666666;
        --dev-green: #00ff41;
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: var(--bg);
        color: var(--text);
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow-x: hidden;
      }

      .page {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        max-width: 1400px;
        width: 100%;
        margin: 0 auto;
        padding: 3rem 1.25rem;
      }

      @media (min-width: 640px) { .page { padding: 4rem 2.5rem; } }
      @media (min-width: 1024px) { .page { padding: 5rem; } }

      .eyebrow {
        font-family: 'Syne', system-ui, sans-serif;
        font-size: 0.5625rem;
        font-weight: 500;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 2rem;
      }

      @media (min-width: 640px) { .eyebrow { font-size: 0.625rem; margin-bottom: 3rem; } }

      h1 {
        font-family: 'Syne', system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 0.82;
        font-size: clamp(2.8rem, 13vw, 14rem);
        color: var(--border);
        user-select: none;
      }

      .content {
        display: grid;
        grid-template-columns: 1fr;
        gap: 2.5rem;
        margin-top: 2rem;
        align-items: start;
      }

      @media (min-width: 1024px) {
        .content {
          grid-template-columns: 1.1fr 1fr;
          gap: 5rem;
          margin-top: 3rem;
          align-items: end;
        }
      }

      h2 {
        font-family: 'Syne', system-ui, sans-serif;
        font-weight: 700;
        font-size: clamp(1.5rem, 5vw, 2.5rem);
        line-height: 1.1;
        letter-spacing: -0.02em;
        margin-bottom: 1rem;
      }

      p {
        color: var(--muted);
        font-size: 0.9375rem;
        line-height: 1.8;
        max-width: 30rem;
      }

      @media (min-width: 640px) { p { font-size: 1rem; } }

      .path {
        font-family: 'JetBrains Mono', Monaco, monospace;
        font-size: 0.75rem;
        color: var(--text);
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 9999px;
        padding: 0.375rem 0.875rem;
        display: inline-block;
        margin-top: 1.5rem;
        max-width: 100%;
        overflow-wrap: anywhere;
      }

      .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 0.625rem;
        padding: 0.75rem 1.5rem;
        border-radius: 9999px;
        font-size: 0.625rem;
        font-weight: 500;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        font-family: 'Syne', system-ui, sans-serif;
        text-decoration: none;
        transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
      }

      @media (min-width: 640px) { .btn { font-size: 0.6875rem; } }

      .btn-primary { background: var(--text); color: #fff; border: 1px solid var(--text); }
      .btn-primary:hover { background: var(--muted); border-color: var(--muted); }

      .btn-ghost { background: transparent; color: var(--muted); border: 1px solid var(--border); }
      .btn-ghost:hover { color: var(--text); border-color: var(--text); }

      footer {
        border-top: 1px solid var(--border);
        padding: 1.75rem 1.25rem;
        font-size: 0.875rem;
        color: var(--muted);
      }

      @media (min-width: 640px) { footer { padding: 2rem 2.5rem; } }
      @media (min-width: 1024px) { footer { padding: 2rem 5rem; } }

      footer .inner {
        max-width: 1400px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 2rem;
        justify-content: space-between;
        align-items: center;
      }

      footer a { color: var(--muted); text-decoration: none; transition: color 0.3s ease; }
      footer a:hover { color: var(--text); }

      /* Mode terminal — préférence système */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: var(--dev-bg);
          --surface: #111111;
          --border: var(--dev-border);
          --text: var(--dev-green);
          --muted: var(--dev-muted);
        }
        body { color: var(--dev-text); }
        h1 { color: var(--dev-border); }
        p { color: var(--dev-muted); }
        .path { color: var(--dev-green); }
        .btn-primary { background: var(--dev-green); color: #000; border-color: var(--dev-green); }
        .btn-primary:hover { background: transparent; color: var(--dev-green); }
        .btn-ghost:hover { color: var(--dev-green); border-color: var(--dev-green); }
        footer a:hover { color: var(--dev-green); }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <span class="eyebrow">Erreur 404 · Page introuvable</span>

      <h1>404</h1>

      <div class="content">
        <div>
          <h2>Cette page n'existe pas.</h2>
          <p>
            Le lien est peut-être obsolète, ou l'adresse mal saisie.
            Le portfolio, lui, est toujours en ligne.
          </p>
          <div class="path" id="requested-path">/</div>
        </div>

        <div class="actions">
          <a class="btn btn-primary" href="/">Retour à l'accueil</a>
          <a class="btn btn-ghost" href="mailto:jeandavidzamblezie@outlook.fr">Signaler un lien mort</a>
        </div>
      </div>
    </main>

    <footer>
      <div class="inner">
        <span>© <span id="year">2026</span> Jean-David Zamblezie</span>
        <a href="https://zamblezie.fr/">zamblezie.fr</a>
      </div>
    </footer>

    <script>
      // Affiche le chemin réellement demandé (sans interprétation HTML)
      var pathEl = document.getElementById('requested-path');
      if (pathEl) pathEl.textContent = window.location.pathname + window.location.search;
      document.getElementById('year').textContent = new Date().getFullYear();
    </script>
  </body>
</html>
